name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: --win
            files: dist/*.exe
          - os: macos-latest
            args: --mac --x64 --arm64
            files: |
              dist/*.dmg
          - os: ubuntu-latest
            args: --linux AppImage
            files: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}