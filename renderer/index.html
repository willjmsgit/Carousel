<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IG Post Preview</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"></span><span class="wordmark">Post Preview</span></div>
    <div class="views"><span class="muted">Live preview</span>
      <nav id="views" class="seg" aria-label="Live preview">
        <button type="button" data-view="off">Off</button>
        <button type="button" data-view="feed">Feed</button>
        <button type="button" data-view="grid">Profile</button>
      </nav>
    </div>
    <div class="top-actions">
      <button type="button" id="undo" class="icon-btn" title="Undo (Ctrl+Z)" aria-label="Undo"></button>
      <button type="button" id="redo" class="icon-btn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"></button>
      <button type="button" id="add" class="btn"></button>
      <button type="button" id="export" class="btn primary"></button>
    </div>
  </header>

  <div id="bar" class="bar" hidden></div>

  <main>
    <aside id="strip" class="strip" aria-label="Slides"></aside>
    <section id="stage" class="stage"></section>
    <aside id="panel" class="panel"></aside>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <input id="file" type="file" accept="image/*" multiple hidden />
  <input id="fileLayer" type="file" accept="image/*" multiple hidden />

  <script src="ratios.js"></script>
  <script src="app.js"></script>
</body>
</html>
